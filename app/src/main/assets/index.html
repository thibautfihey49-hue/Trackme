<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMe — SMS Données</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
        body { padding:16px; background:#f5f5f5; max-width:500px; margin:0 auto; }
        h1 { text-align:center; color:#1a73e8; margin-bottom:16px; }
        .card { background:white; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        input { width:100%; padding:14px; border:2px solid #ddd; border-radius:8px; font-size:16px; margin-bottom:10px; }
        button { width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; margin:4px 0; transition:all 0.2s; }
        button:active { opacity:0.85; transform:scale(0.98); }
        .btn-green { background:#34a853; color:white; }
        .btn-blue { background:#1a73e8; color:white; }
        .btn-orange { background:#fa7b17; color:white; }
        .btn-red { background:#ea4335; color:white; }
        .btn-gray { background:#9aa0a6; color:white; }
        #status { padding:12px; border-radius:8px; background:#e6f4ea; color:#137333; margin:8px 0; white-space:pre-wrap; font-size:14px; line-height:1.5; }
        .status-wait { background:#fef7e0; color:#804b00; }
        .status-err { background:#fce8e6; color:#c5221f; }
        #map { height:350px; border-radius:8px; margin-top:10px; }
        .coords { margin-top:12px; font-size:14px; line-height:1.8; background:#f8f9fa; padding:12px; border-radius:8px; }
        .info-box { background:#e8f0fe; border-left:4px solid #1a73e8; padding:10px; margin:10px 0; border-radius:4px; font-size:13px; }
        .hidden { display:none !important; }
    </style>
</head>
<body>

<h1>📍 TrackMe — SMS Données</h1>

<div class="card">
    <input type="tel" id="num" placeholder="Numéro (ex: 0612345678)">
    
    <div id="status">👋 Prêt — Entre un numéro et clique sur un bouton</div>
    
    <button class="btn-green" id="btnGps" onclick="demanderPosition()">📍 Partager ma position</button>
    <button class="btn-blue" onclick="centerOnMe()">🎯 Centrer sur ma position</button>
    <button class="btn-green" onclick="envoyerPosition()">📤 Envoyer ma position</button>
    <button class="btn-orange" onclick="demanderPositionAutre()">📥 Demander position</button>
    <button class="btn-red" onclick="stopGPS()">⏹️ Arrêter le GPS</button>
    
    <div class="info-box">
        🔒 Les messages sont envoyés par <strong>SMS de données (port 7777)</strong> — invisibles dans la boîte de réception<br>
        ✅ Sans internet — fonctionne avec le réseau mobile seulement
    </div>
    
    <div class="coords">
        <div><strong>Ma position:</strong> <span id="myCoords">—</span></div>
        <div><strong>Précision:</strong> <span id="myAcc">—</span></div>
        <div><strong>Autre:</strong> <span id="otherCoords">—</span></div>
        <div><strong>Distance:</strong> <span id="distance">—</span></div>
    </div>
    
    <div id="map"></div>
</div>

<script>
let myLat = null, myLon = null, myAcc = null;
let otherLat = null, otherLon = null;
let map, myMarker, otherMarker, accCircle;
let watchId = null;
let envoiEnCours = false;

// Initialisation carte
function initMap() {
    map = L.map('map').setView([47.4764, -0.5515], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom:19, attribution:'© OpenStreetMap'
    }).addTo(map);
    
    const myIcon = L.divIcon({
        className:'', html:'<div style="width:24px;height:24px;background:#1a73e8;border:3px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
        iconSize:[24,24], iconAnchor:[12,12]
    });
    myMarker = L.marker([47.4764, -0.5515], {icon:myIcon, zIndexOffset:1000}).addTo(map);
    
    accCircle = L.circle([47.4764, -0.5515], {color:'#1a73e8', fillColor:'#1a73e8', fillOpacity:0.12, radius:50}).addTo(map);
    
    const otherIcon = L.divIcon({
        className:'', html:'<div style="width:24px;height:24px;background:#ea4335;border:3px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
        iconSize:[24,24], iconAnchor:[12,12]
    });
    otherMarker = L.marker([0,0], {icon:otherIcon, opacity:0}).addTo(map);
}

// ✅ DEMANDER LA POSITION (popup comme un site web)
function demanderPosition() {
    if(!navigator.geolocation) {
        setStatus("❌ La géolocalisation n'est pas supportée", true);
        return;
    }
    
    setStatus("🔔 Popup de position → Clique sur AUTORISER", "status-wait");
    
    watchId = navigator.geolocation.watchPosition(
        (position) => {
            myLat = position.coords.latitude;
            myLon = position.coords.longitude;
            myAcc = position.coords.accuracy;
            
            document.getElementById('myCoords').textContent = myLat.toFixed(6) + ", " + myLon.toFixed(6);
            document.getElementById('myAcc').textContent = Math.round(myAcc) + " m";
            
            myMarker.setLatLng([myLat, myLon]);
            accCircle.setLatLng([myLat, myLon]);
            accCircle.setRadius(myAcc);
            map.setView([myLat, myLon], 17);
            
            if(otherLat && otherLon) mettreAJourDistance();
            
            setStatus("✅ Position GPS obtenue !\n📍 " + myLat.toFixed(6) + ", " + myLon.toFixed(6) + "\n🎯 Précision: " + Math.round(myAcc) + "m");
        },
        (erreur) => {
            let msg;
            if(erreur.code === erreur.PERMISSION_DENIED)
                msg = "❌ Permission refusée.\n→ Clique à nouveau et choisis AUTORISER";
            else if(erreur.code === erreur.POSITION_UNAVAILABLE)
                msg = "⚠️ GPS indisponible.\n→ Sors à l'extérieur et active le GPS de ton téléphone";
            else
                msg = "❌ Erreur GPS: " + erreur.message;
            setStatus(msg, true);
        },
        { enableHighAccuracy:true, timeout:30000, maximumAge:0 }
    );
}

// ✅ ENVOYER MA POSITION PAR SMS DONNÉES
function envoyerPosition() {
    if(!myLat || !myLon) {
        setStatus("⚠️ D'abord clique sur '📍 Partager ma position'", true);
        return;
    }
    
    const num = nettoyerNumero();
    if(!num) return;
    
    envoiEnCours = true;
    setStatus("📤 Envoi de la position à " + num + "...", "status-wait");
    
    if(typeof Android !== 'undefined' && Android.sendPositionSMS) {
        Android.sendPositionSMS(num, myLat, myLon);
    } else {
        // Fallback si l'interface Android n'est pas disponible
        window.location.href = "sms:" + num + "?body=POS:" + myLat.toFixed(6) + "," + myLon.toFixed(6);
        setStatus("📱 Appuie sur ENVOYER dans SMS");
        envoiEnCours = false;
    }
}

// ✅ DEMANDER LA POSITION DE L'AUTRE
function demanderPositionAutre() {
    const num = nettoyerNumero();
    if(!num) return;
    
    setStatus("📥 Demande de position envoyée à " + num + "\n⏳ En attente de réponse...", "status-wait");
    
    if(typeof Android !== 'undefined' && Android.sendRequestSMS) {
        Android.sendRequestSMS(num);
    } else {
        window.location.href = "sms:" + num + "?body=DEMANDE";
        setStatus("📱 Appuie sur ENVOYER dans SMS");
    }
}

// ✅ APPELÉ DEPUIS ANDROID QUAND LE SMS EST ENVOYÉ
function smsEnvoye(succes) {
    envoiEnCours = false;
    if(succes) {
        setStatus("✅ Message envoyé par SMS données (invisible) !\n📨 Port 7777 — pas dans la boîte de réception");
    } else {
        setStatus("⚠️ SMS données non supporté → Envoyé par SMS texte classique");
    }
}

// ✅ RECEVOIR UN SMS DE L'AUTRE PERSONNE
function recevoirSMS(expediteur, texte) {
    console.log("SMS reçu de " + expediteur + ": " + texte);
    
    if(texte.startsWith("POS:")) {
        // Format: POS:47.4764,-0.5515
        const parties = texte.replace("POS:", "").split(",");
        if(parties.length === 2) {
            otherLat = parseFloat(parties[0]);
            otherLon = parseFloat(parties[1]);
            
            document.getElementById('otherCoords').textContent = 
                otherLat.toFixed(6) + ", " + otherLon.toFixed(6);
            
            otherMarker.setLatLng([otherLat, otherLon]);
            otherMarker.setOpacity(1);
            otherMarker.bindPopup("📍 " + expediteur + "<br>" + otherLat.toFixed(6) + ", " + otherLon.toFixed(6)).openPopup();
            
            map.setView([otherLat, otherLon], 15);
            mettreAJourDistance();
            
            setStatus("✅ Position reçue de " + expediteur + " !\n📍 " + otherLat.toFixed(6) + ", " + otherLon.toFixed(6));
        }
    } else if(texte === "DEMANDE") {
        // ✅ Réponse automatique à une demande de position
        setStatus("📩 Demande reçue de " + expediteur + "\n📤 Envoi automatique de ma position...");
        setTimeout(() => {
            if(myLat && myLon) {
                if(typeof Android !== 'undefined' && Android.sendPositionSMS) {
                    Android.sendPositionSMS(expediteur.startsWith('0') ? '+33' + expediteur.substring(1) : expediteur, myLat, myLon);
                }
            }
        }, 800);
    }
}

function nettoyerNumero() {
    let num = document.getElementById('num').value.trim().replace(/\s/g, '').replace(/-/g, '');
    if(!num) {
        setStatus("⚠️ Entre un numéro de téléphone", true);
        return null;
    }
    
    // Formatage automatique France
    if(num.match(/^0[1-9]\d{8}$/)) {
        num = '+33' + num.substring(1);
    } else if(!num.startsWith('+')) {
        num = '+' + num;
    }
    return num;
}

function centerOnMe() {
    if(!myLat) { setStatus("⚠️ D'abord clique sur '📍 Partager ma position'", true); return; }
    map.setView([myLat, myLon], 17);
    setStatus("🎯 Centré sur ma position");
}

function stopGPS() {
    if(watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        setStatus("⏹️ GPS arrêté");
    }
}

function mettreAJourDistance() {
    const d = calculerDistance(myLat, myLon, otherLat, otherLon);
    document.getElementById('distance').textContent = d < 1000 ? Math.round(d) + " m" : (d/1000).toFixed(2) + " km";
}

function calculerDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1)*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)*Math.sin(Δλ/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function setStatus(texte, estErreur=false) {
    const el = document.getElementById('status');
    el.textContent = texte;
    el.className = estErreur ? 'status-err' : '';
}

window.onload = initMap;
</script>
</body>
</html>
