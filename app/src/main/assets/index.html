<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
        body { padding:16px; background:#f5f5f5; max-width:500px; margin:0 auto; }
        h1 { text-align:center; color:#1a73e8; margin-bottom:16px; }
        .card { background:white; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        input { width:100%; padding:14px; border:2px solid #ddd; border-radius:8px; font-size:16px; margin-bottom:10px; }
        button { width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; margin:4px 0; }
        .btn-green { background:#34a853; color:white; }
        .btn-blue { background:#1a73e8; color:white; }
        .btn-orange { background:#fa7b17; color:white; }
        .btn-red { background:#ea4335; color:white; }
        #status { padding:12px; border-radius:8px; background:#e6f4ea; color:#137333; margin:8px 0; white-space:pre-wrap; }
        .status-err { background:#fce8e6; color:#c5221f; }
        #map { height:350px; border-radius:8px; margin-top:10px; }
        .coords { margin-top:12px; font-size:14px; line-height:1.8; background:#f8f9fa; padding:12px; border-radius:8px; }
        .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:#999; margin-right:8px; }
        .dot.active { background:#34a853; animation:pulse 2s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,168,83,0.4);} 70%{box-shadow:0 0 0 8px rgba(52,168,83,0);} 100%{box-shadow:0 0 0 0 rgba(52,168,83,0);} }
    </style>
</head>
<body>

<h1>📍 TrackMe — GPS Précis</h1>

<div class="card">
    <input type="tel" id="num" placeholder="Numéro (ex: 0612345678)">
    
    <div id="status">👋 Bienvenue ! Clique sur le bouton pour partager ta position</div>
    
    <button class="btn-green" onclick="demanderPosition()">
        📍 Partager ma position
    </button>
    <button class="btn-blue" onclick="centerOnMe()">🎯 Centrer sur moi</button>
    <button class="btn-green" onclick="sendPos()">📤 Envoyer ma position à quelqu'un</button>
    <button class="btn-orange" onclick="askPos()">📥 Demander la position de quelqu'un</button>
    <button class="btn-red" onclick="stopGPS()">⏹️ Arrêter le GPS</button>
    
    <div class="coords">
        <div><strong>Ma position:</strong> <span id="myCoords">—</span></div>
        <div><strong>Précision:</strong> <span id="myAcc">—</span></div>
        <div><strong>Autre personne:</strong> <span id="otherCoords">—</span></div>
        <div><strong>Distance:</strong> <span id="distance">—</span></div>
    </div>
    
    <div id="map"></div>
</div>

<script>
let myLat = null, myLon = null, myAcc = null;
let otherLat = null, otherLon = null;
let map, myMarker, otherMarker, accCircle;
let watchId = null;

// Initialisation de la carte
function initMap() {
    map = L.map('map').setView([47.4764, -0.5515], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom:19, attribution:'© OpenStreetMap'
    }).addTo(map);
    
    const myIcon = L.divIcon({
        className:'', html:'<div style="width:24px;height:24px;background:#1a73e8;border:3px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
        iconSize:[24,24], iconAnchor:[12,12]
    });
    myMarker = L.marker([47.4764, -0.5515], {icon:myIcon, zIndexOffset:1000}).addTo(map);
    
    accCircle = L.circle([47.4764, -0.5515], {color:'#1a73e8', fillColor:'#1a73e8', fillOpacity:0.12, radius:50}).addTo(map);
    
    const otherIcon = L.divIcon({
        className:'', html:'<div style="width:24px;height:24px;background:#ea4335;border:3px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
        iconSize:[24,24], iconAnchor:[12,12]
    });
    otherMarker = L.marker([0,0], {icon:otherIcon, opacity:0}).addTo(map);
}

// ✅ LA FONCTION QUI DÉCLENCHE LA POPUP COMME UN SITE INTERNET
function demanderPosition() {
    if(!navigator.geolocation) {
        setStatus("❌ La géolocalisation n'est pas supportée sur cet appareil", true);
        return;
    }
    
    setStatus("🔔 La popup va apparaître → Clique sur AUTORISER !");
    
    // ✅ ICI : LE NAVIGATEUR AFFICHE SA PROPRE POPUP
    // "Ce site veut accéder à votre position ? Autoriser / Refuser"
    navigator.geolocation.watchPosition(
        // ✅ Si l'utilisateur clique sur "AUTORISER"
        (position) => {
            myLat = position.coords.latitude;
            myLon = position.coords.longitude;
            myAcc = position.coords.accuracy;
            
            document.getElementById('myCoords').textContent = myLat.toFixed(6) + ", " + myLon.toFixed(6);
            document.getElementById('myAcc').textContent = Math.round(myAcc) + " mètres";
            
            myMarker.setLatLng([myLat, myLon]);
            accCircle.setLatLng([myLat, myLon]);
            accCircle.setRadius(myAcc);
            map.setView([myLat, myLon], 17);
            
            if(otherLat && otherLon) updateDistance();
            
            setStatus("✅ Position obtenue !\n📍 " + myLat.toFixed(6) + ", " + myLon.toFixed(6) + "\n🎯 Précision: " + Math.round(myAcc) + "m");
        },
        // ❌ Si l'utilisateur clique sur "REFUSER"
        (erreur) => {
            let message;
            if(erreur.code === erreur.PERMISSION_DENIED) {
                message = "❌ Tu as refusé l'accès à la position.\n→ Clique à nouveau sur le bouton et choisis AUTORISER";
            } else if(erreur.code === erreur.POSITION_UNAVAILABLE) {
                message = "⚠️ Position indisponible.\n→ Sors à l'extérieur et réessaie";
            } else {
                message = "❌ Erreur: " + erreur.message;
            }
            setStatus(message, true);
        },
        // Options pour une précision maximale
        {
            enableHighAccuracy: true,
            timeout: 30000,
            maximumAge: 0
        }
    );
}

function centerOnMe() {
    if(!myLat) { setStatus("⚠️ D'abord clique sur 'Partager ma position'", true); return; }
    map.setView([myLat, myLon], 17);
    setStatus("🎯 Centré sur ma position");
}

function stopGPS() {
    if(watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        setStatus("⏹️ GPS arrêté");
    }
}

function sendPos() {
    if(!myLat) { setStatus("⚠️ D'abord clique sur 'Partager ma position'", true); return; }
    let num = document.getElementById('num').value.trim().replace(/\s/g,'');
    if(!num) { setStatus("⚠️ Entre un numéro de téléphone", true); return; }
    
    let dest = num.startsWith('0') ? '+33' + num.substring(1) : num;
    if(!dest.startsWith('+')) dest = '+' + dest;
    
    const msg = "POS:" + myLat.toFixed(6) + "," + myLon.toFixed(6);
    
    try {
        if(typeof Android !== 'undefined' && Android.sendDataSMS) {
            Android.sendDataSMS(dest, 7777, msg);
            setStatus("✅ Position envoyée à " + dest);
        } else {
            window.location.href = "sms:" + dest + "?body=" + encodeURIComponent(msg);
            setStatus("📱 Appuie sur ENVOYER dans SMS");
        }
    } catch(e) {
        window.location.href = "sms:" + dest + "?body=" + encodeURIComponent(msg);
    }
}

function askPos() {
    let num = document.getElementById('num').value.trim().replace(/\s/g,'');
    if(!num) { setStatus("⚠️ Entre un numéro de téléphone", true); return; }
    
    let dest = num.startsWith('0') ? '+33' + num.substring(1) : num;
    if(!dest.startsWith('+')) dest = '+' + dest;
    
    try {
        if(typeof Android !== 'undefined' && Android.sendDataSMS) {
            Android.sendDataSMS(dest, 7777, "DEMANDE");
            setStatus("⏳ Demande envoyée à " + dest);
        } else {
            window.location.href = "sms:" + dest + "?body=DEMANDE";
            setStatus("📱 Appuie sur ENVOYER dans SMS");
        }
    } catch(e) {
        window.location.href = "sms:" + dest + "?body=DEMANDE";
    }
}

window.receiveSMS = function(from, text) {
    if(text.startsWith("POS:")) {
        const parts = text.replace("POS:","").split(",");
        if(parts.length === 2) {
            otherLat = parseFloat(parts[0]);
            otherLon = parseFloat(parts[1]);
            document.getElementById('otherCoords').textContent = otherLat.toFixed(6) + ", " + otherLon.toFixed(6);
            otherMarker.setLatLng([otherLat, otherLon]);
            otherMarker.setOpacity(1);
            map.setView([otherLat, otherLon], 15);
            updateDistance();
            setStatus("✅ Position reçue de " + from);
        }
    } else if(text === "DEMANDE") {
        setStatus("📩 Demande reçue — Envoi automatique...");
        setTimeout(() => sendPos(), 500);
    }
};

function updateDistance() {
    const d = getDistance(myLat, myLon, otherLat, otherLon);
    document.getElementById('distance').textContent = d < 1000 ? Math.round(d)+"m" : (d/1000).toFixed(2)+"km";
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
    const Δφ = (lat2-lat1)*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)*Math.sin(Δλ/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function setStatus(text, isErr=false) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = isErr ? 'status-err' : '';
}

window.onload = initMap;
</script>
</body>
</html>
